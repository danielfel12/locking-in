.glass{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.07);box-shadow:var(--shadow)}

.metric{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px}
.spin{animation:spin 1s linear infinite}

input::placeholder{color:#53617f}

const DAYS_ES=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MONTHS_ES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function getWeekDates(baseDate){
  const mondayBasedIndex = (baseDate.getDay()+6)%7;
  const start = new Date(baseDate);
  start.setDate(baseDate.getDate()-mondayBasedIndex);
  return [0,1,2,3,4,5,6].map(i=>{
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    return d;
  });
}

function dayToProtocolKey(date){ return date.getDay(); }
function dateKey(date){ return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`; }
function fmtDate(date){ return `${date.getDate()} ${MONTHS_ES[date.getMonth()]} ${date.getFullYear()}`; }
function fmtShort(date){ return `${date.getDate()} ${MONTHS_ES[date.getMonth()].slice(0,3)}`; }
function fmtTime(date){ return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`; }

function countDayMetrics(protocol){
  const blocks = protocol?.blocks || [];
  return {
    tasks: blocks.filter(b=>b.checkable).length,
    exercises: blocks.reduce((n,b)=>n+(b.exercises?.length||0),0),
    supplements: blocks.reduce((n,b)=>n+(b.supplements?.length||0),0),
  };
}

function WeekDayCard({date, isToday, protocol, checkedMap, onPick, isSelected}){
  const metrics = countDayMetrics(protocol);
  const k = dateKey(date);
  const done = protocol?.blocks?.filter(b=>b.checkable && checkedMap?.[k]?.[b.id]).length || 0;
  const total = protocol?.blocks?.filter(b=>b.checkable).length || 0;
  const pct = total ? Math.round((done/total)*100) : 0;
  return (
    <button onClick={onPick} className="card" style={{padding:16,textAlign:'left',borderColor:isSelected?(protocol?.color||C.green):C.border, background:isSelected?`linear-gradient(180deg, ${(protocol?.color||C.green)}18, rgba(13,20,40,.96))`:'linear-gradient(180deg, rgba(14,23,45,.96), rgba(8,13,28,.96))'}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'flex-start'}}>
        <div>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:6,flexWrap:'wrap'}}>
            <span className="mono" style={{fontSize:11,color:C.muted}}>{fmtShort(date)}</span>
            {isToday && <span className="pill" style={{background:`${C.green}1a`,color:C.green}}>Hoy</span>}
          </div>
          <div style={{fontSize:18,fontWeight:800,lineHeight:1.1}}>{DAYS_ES[protocol ? dayToProtocolKey(date) : date.getDay()]}</div>
          <div style={{fontSize:12,color:protocol?.color||C.muted,marginTop:5,fontWeight:700}}>{protocol?.tag || 'Sin protocolo'}</div>
        </div>
        <div style={{textAlign:'right',minWidth:72}}>
          <div className="mono" style={{fontSize:18,fontWeight:800,color:protocol?.color||C.muted}}>{done}/{total}</div>
          <div style={{fontSize:11,color:C.muted}}>hecho</div>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginTop:14}}>
        <div className="metric"><div className="mono" style={{fontSize:18,fontWeight:800}}>{metrics.tasks}</div><div style={{fontSize:11,color:C.muted}}>bloques</div></div>
        <div className="metric"><div className="mono" style={{fontSize:18,fontWeight:800}}>{metrics.exercises}</div><div style={{fontSize:11,color:C.muted}}>ejercicios</div></div>
        <div className="metric"><div className="mono" style={{fontSize:18,fontWeight:800}}>{pct}%</div><div style={{fontSize:11,color:C.muted}}>avance</div></div>
      </div>
    </button>
  );
}

  return (
    <div style={{minHeight:'100vh',paddingBottom:48}}>
      <div style={{position:'sticky',top:0,zIndex:40,backdropFilter:'blur(18px)',background:'linear-gradient(180deg, rgba(6,8,22,.94), rgba(6,8,22,.72))',borderBottom:'1px solid rgba(255,255,255,.05)'}}>
        <div style={{maxWidth:1080,margin:'0 auto',padding:'18px 14px 14px'}}>
          <div className="card" style={{padding:18,borderRadius:28,background:'linear-gradient(135deg, rgba(17,28,56,.96), rgba(8,12,25,.96))'}}>
            <div style={{display:'flex',justifyContent:'space-between',gap:14,alignItems:'flex-start',flexWrap:'wrap'}}>
              <div>
                <div className="mono" style={{fontSize:11,letterSpacing:2.4,color:C.green,marginBottom:10}}>THE 1% PROTOCOL</div>
                <div style={{fontSize:28,fontWeight:900,lineHeight:1.05,letterSpacing:-1}}>{DAYS_ES[todayDow]}</div>
                <div style={{fontSize:14,color:C.muted,marginTop:6}}>{fmtDate(now)} · {fmtTime(now)}</div>
              </div>
              <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
                {todayProtocol && <span className="pill" style={{background:`${todayProtocol.color}1c`,color:todayProtocol.color,padding:'10px 14px'}}>{todayProtocol.tag}</span>}
                <span className="pill" style={{background:`${backendStatus.ok?C.green:C.orange}1c`,color:backendStatus.ok?C.green:C.orange,padding:'10px 14px'}}>{backendStatus.message}</span>
              </div>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12,marginTop:18}}>
              <div className="metric"><div className="mono" style={{fontSize:26,fontWeight:900,color:C.green}}>{progressToday}%</div><div style={{fontSize:12,color:C.muted}}>avance del día</div></div>
              <div className="metric"><div className="mono" style={{fontSize:26,fontWeight:900}}>{doneToday}/{todayCheckable.length}</div><div style={{fontSize:12,color:C.muted}}>bloques completados</div></div>
              <div className="metric"><div className="mono" style={{fontSize:26,fontWeight:900,color:backendStatus.whoop?C.teal:C.muted}}>{backendStatus.whoop ? 'ON' : 'OFF'}</div><div style={{fontSize:12,color:C.muted}}>estado WHOOP</div></div>
              <div className="metric"><div className="mono" style={{fontSize:26,fontWeight:900,color:C.blue}}>{whoopData?.recovery?.score ?? '--'}</div><div style={{fontSize:12,color:C.muted}}>recovery</div></div>
            </div>

            <div style={{display:'flex',gap:8,marginTop:16}}>
              {[['today','Hoy'],['week','Semana']].map(([id,label])=>(
                <button key={id} onClick={()=>setActiveTab(id)} style={{flex:1,padding:'12px 14px',borderRadius:16,fontWeight:800,fontSize:13,background:activeTab===id?`linear-gradient(180deg, ${C.green}28, ${C.green}12)`:'rgba(255,255,255,.03)',color:activeTab===id?C.green:C.muted,border:`1px solid ${activeTab===id?`${C.green}55`:'rgba(255,255,255,.06)'}`}}>{label}</button>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div style={{maxWidth:1080,margin:'0 auto',padding:'14px',display:'grid',gridTemplateColumns:'1.2fr .8fr',gap:14}}>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {activeTab==='today' && (
            <>
              <div className="card" style={{padding:16,borderRadius:24}}>
                {weather ? (
                  <div style={{display:'grid',gridTemplateColumns:'1.1fr .9fr',gap:14,alignItems:'stretch'}}>
                    <div>
                      <div style={{fontSize:13,color:C.muted,marginBottom:10}}>📍 {location}</div>
                      <div style={{display:'flex',alignItems:'flex-end',gap:12}}>
                        <div style={{fontSize:54,fontWeight:900,lineHeight:1}}>{weather.temp}°</div>
                        <div style={{paddingBottom:6}}>
                          <div style={{fontSize:22}}>{wmoInfo.icon}</div>
                          <div style={{fontSize:13,color:C.muted}}>{wmoInfo.label}</div>
                        </div>
                      </div>
                      <div style={{fontSize:13,color:C.muted,marginTop:8}}>Sensación {weather.feels}°C</div>
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                      <div className="metric"><div className="mono" style={{fontSize:24,fontWeight:900,color:C.blue}}>{weather.humidity}%</div><div style={{fontSize:11,color:C.muted}}>humedad</div></div>
                      <div className="metric"><div className="mono" style={{fontSize:24,fontWeight:900,color:C.teal}}>{weather.wind}</div><div style={{fontSize:11,color:C.muted}}>km/h viento</div></div>
                      <div className="metric" style={{gridColumn:'1 / -1'}}><div style={{fontSize:12,color:weather.temp>30?C.orange:weather.humidity>80?C.orange:C.green,fontWeight:700}}>{weather.temp>30?'Calor fuerte. Añade electrolitos y baja intensidad si te sube la FC.':weather.humidity>80?'Humedad alta. Vas a sudar más de lo que crees.':weather.temp<15?'Frío. Haz 10 min extra de calentamiento.':'Buenas condiciones para entrenar.'}</div></div>
                    </div>
                  </div>
                ) : weatherErr ? <div style={{fontSize:13,color:C.muted}}>⚠️ {weatherErr}</div> : <div style={{display:'flex',alignItems:'center',gap:10}}><div className="spin" style={{width:26,height:26,borderRadius:'50%',border:`2px solid ${C.green}`,borderTopColor:'transparent'}}/><div style={{fontSize:13,color:C.muted}}>Obteniendo clima y ubicación...</div></div>}
              </div>

              {(todayProtocol?.blocks || []).map(block=>(
                <BlockCard key={block.id} block={block} checked={!!todayChecked[block.id]} expanded={!!expanded[`today-${block.id}`]} toggleCheck={(id)=>toggleCheck(id,todayStorageKey)} toggleExpand={(id)=>toggleExpand(`today-${id}`)} weights={weights} saveWeight={saveWeight} dayStorageKey={todayStorageKey} />
              ))}
            </>
          )}

          {activeTab==='week' && (
            <>
              <div className="card" style={{padding:18,borderRadius:24}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,flexWrap:'wrap'}}>
                  <div>
                    <div className="mono" style={{fontSize:12,letterSpacing:1.6,color:C.muted,marginBottom:8}}>SEMANA OPERATIVA</div>
                    <div style={{fontSize:24,fontWeight:900,letterSpacing:-.8}}>Semana completa con fecha, rutina y ejercicios</div>
                    <div style={{fontSize:13,color:C.muted,marginTop:6}}>Ahora sí sirve. Antes solo mostraba un resumen cosmético.</div>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,minmax(90px,1fr))',gap:10,minWidth:'min(100%,320px)'}}>
                    <div className="metric"><div className="mono" style={{fontSize:22,fontWeight:900}}>{totalWeekTasks}</div><div style={{fontSize:11,color:C.muted}}>bloques</div></div>
                    <div className="metric"><div className="mono" style={{fontSize:22,fontWeight:900,color:C.blue}}>{totalWeekExercises}</div><div style={{fontSize:11,color:C.muted}}>ejercicios</div></div>
                    <div className="metric"><div className="mono" style={{fontSize:22,fontWeight:900,color:C.green}}>{weeklyPct}%</div><div style={{fontSize:11,color:C.muted}}>avance</div></div>
                  </div>
                </div>
              </div>

              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:12}}>
                {weekSummary.map(({date,protocol})=>(
                  <WeekDayCard key={date.toISOString()} date={date} isToday={dateKey(date)===todayStorageKey} protocol={protocol} checkedMap={checkedByDay} onPick={()=>setSelectedWeekDate(new Date(date))} isSelected={dateKey(date)===selectedDateKey} />
                ))}
              </div>

              <div className="card" style={{padding:18,borderRadius:24}}>
                <div style={{display:'flex',justifyContent:'space-between',gap:10,alignItems:'flex-start',flexWrap:'wrap'}}>
                  <div>
                    <div className="mono" style={{fontSize:12,letterSpacing:1.6,color:C.muted,marginBottom:8}}>DETALLE DEL DÍA</div>
                    <div style={{fontSize:24,fontWeight:900,letterSpacing:-.8}}>{DAYS_ES[selectedWeekDate.getDay()]} · {fmtDate(selectedWeekDate)}</div>
                    <div style={{fontSize:13,color:selectedProtocol?.color||C.muted,marginTop:6,fontWeight:700}}>{selectedProtocol?.tag || 'Sin protocolo'}</div>
                  </div>
                  <span className="pill" style={{background:`${selectedProtocol?.color || C.muted}1a`,color:selectedProtocol?.color || C.muted}}>{countDayMetrics(selectedProtocol).exercises} ejercicios</span>
                </div>

                <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:16}}>
                  {(selectedProtocol?.blocks || []).map(block=>(
                    <BlockCard key={`${selectedDateKey}-${block.id}`} block={block} checked={!!selectedChecked[block.id]} expanded={!!expanded[`week-${selectedDateKey}-${block.id}`]} toggleCheck={(id)=>toggleCheck(id,selectedDateKey)} toggleExpand={(id)=>toggleExpand(`week-${selectedDateKey}-${id}`)} weights={weights} saveWeight={saveWeight} dayStorageKey={selectedDateKey} />
                  ))}
                </div>
              </div>
            </>
          )}
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="card" style={{padding:18,borderRadius:24}}>
            <div className="mono" style={{fontSize:12,letterSpacing:1.6,color:C.muted,marginBottom:10}}>BACKEND</div>
            <div style={{fontSize:22,fontWeight:900,letterSpacing:-.6}}>Capa serverless lista para escalar</div>
            <div style={{fontSize:13,color:C.muted,marginTop:8,lineHeight:1.65}}>Tu app estaba demasiado frontend-only. Eso está bien para una demo, no para una app seria con WHOOP. Ahora queda pensada para Netlify Functions, health check, OAuth y lectura de recovery/sleep.</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr',gap:10,marginTop:14}}>
              <div className="metric"><div style={{fontSize:12,color:C.muted}}>Health endpoint</div><div className="mono" style={{fontSize:18,fontWeight:900,color:backendStatus.ok?C.green:C.orange}}>{backendStatus.ok?'OK':'OFF'}</div></div>
              <div className="metric"><div style={{fontSize:12,color:C.muted}}>WHOOP auth</div><div className="mono" style={{fontSize:18,fontWeight:900,color:backendStatus.whoop?C.teal:C.muted}}>{backendStatus.whoop?'CONNECTED':'PENDING'}</div></div>
              <div className="metric"><div style={{fontSize:12,color:C.muted}}>Último recovery</div><div className="mono" style={{fontSize:18,fontWeight:900}}>{whoopData?.recovery?.score ?? '--'}</div></div>
              <div className="metric"><div style={{fontSize:12,color:C.muted}}>Sleep needed</div><div className="mono" style={{fontSize:18,fontWeight:900}}>{whoopData?.sleep?.needed ?? '--'}</div></div>
            </div>
          </div>

          <div className="card" style={{padding:18,borderRadius:24}}>
            <div className="mono" style={{fontSize:12,letterSpacing:1.6,color:C.muted,marginBottom:10}}>CAMBIOS PRO</div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {[
                'Tipografía premium: Inter + JetBrains Mono para que deje de verse como demo de terminal.',
                'Semana con fecha real por día, selección activa y detalle completo de bloques, ejercicios y suplementos.',
                'Persistencia mejorada por fecha: checks diarios y pesos guardados por día/bloque/ejercicio.',
                'Panel lateral para backend/WHOOP, listo para ampliar con recovery, HRV, sleep y strain.',
                'Diseño con mejor jerarquía visual, métricas útiles y tarjetas que sí parecen producto serio.'
              ].map((t,i)=><div key={i} className="metric" style={{fontSize:13,lineHeight:1.6}}>{t}</div>)}
            </div>
          </div>
        </div>
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
