<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="The 1% Protocol"/>
<meta name="theme-color" content="#07111f"/>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://api.open-meteo.com"/>
<link rel="preconnect" href="https://nominatim.openstreetmap.org"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<title>The 1% Protocol</title>
<style>
:root{
  --bg:#07111f; --bg2:#0b1730; --card:#0d1629; --card2:#101c34; --line:#1a2945;
  --txt:#eef3ff; --muted:#9fb0d1; --muted2:#6d7da0; --green:#32e48b; --red:#ff6178;
  --blue:#61a8ff; --yellow:#f9c74f; --orange:#ff9857; --purple:#ad8cff; --teal:#45d6d1;
  --shadow:0 20px 60px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#0c2045 0%, var(--bg) 38%, #050b16 100%);color:var(--txt);min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;border:0}
a{color:inherit;text-decoration:none}
#root{min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:20px 14px 48px}
.shell{background:linear-gradient(180deg,rgba(17,29,54,.96),rgba(10,18,34,.96));border:1px solid rgba(77,104,155,.28);box-shadow:var(--shadow);border-radius:28px;padding:18px}
.header{display:grid;gap:14px;margin-bottom:16px}
.headtop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.eyebrow{font-family:"JetBrains Mono", monospace;letter-spacing:.28em;font-size:11px;text-transform:uppercase;color:var(--green)}
.title{font-size:44px;font-weight:900;line-height:.95;margin-top:6px}
.subtle{color:var(--muted);font-size:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:10px 14px;border-radius:999px;background:rgba(15,31,57,.8);border:1px solid rgba(72,101,151,.28);font-size:12px;font-weight:800;color:var(--green);letter-spacing:.08em;text-transform:uppercase}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:linear-gradient(180deg,rgba(15,27,51,.95),rgba(12,22,42,.95));border:1px solid rgba(73,103,151,.2);border-radius:18px;padding:16px}
.stat .label{font-size:13px;color:var(--muted)}
.stat .value{font-size:40px;font-weight:900;line-height:1;margin-bottom:6px}
.stat .value.small{font-size:28px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tab{padding:14px 16px;border-radius:16px;background:#10182d;color:var(--muted);border:1px solid rgba(74,101,145,.22);font-weight:800}
.tab.active{background:linear-gradient(180deg,rgba(38,82,74,.55),rgba(16,36,33,.92));border-color:rgba(73,205,145,.34);color:var(--green);box-shadow:inset 0 0 0 1px rgba(69,206,145,.14)}
.connectRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:12px 16px;border-radius:14px;background:linear-gradient(180deg,#1b2846,#10192e);border:1px solid rgba(78,107,155,.25);color:var(--txt);font-weight:700}
.btn.primary{background:linear-gradient(180deg,#1e6246,#15392d);border-color:rgba(88,223,162,.35);color:var(--green)}
.btn.ghost{background:transparent}
.content{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.weather{display:grid;grid-template-columns:1.5fr .7fr .7fr;gap:12px;background:linear-gradient(180deg,rgba(10,20,39,.92),rgba(6,14,30,.94));border:1px solid rgba(72,101,151,.2);border-radius:24px;padding:16px}
.weatherMain{display:flex;gap:12px;align-items:center}
.temp{font-size:64px;font-weight:900;line-height:1}
.kicker{font-family:"JetBrains Mono", monospace;font-size:12px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}
.miniCard{background:rgba(18,30,56,.85);border:1px solid rgba(73,102,151,.2);border-radius:18px;padding:14px}
.trainingHint{grid-column:2/4;background:rgba(16,30,24,.9);border:1px solid rgba(69,206,145,.16);color:var(--green);padding:10px 12px;border-radius:14px;font-weight:700;font-size:14px;display:flex;align-items:center}
.list{display:flex;flex-direction:column;gap:12px}
.block{background:linear-gradient(180deg,rgba(16,27,49,.96),rgba(12,21,38,.96));border:1px solid rgba(74,104,151,.18);border-left:4px solid var(--accent,#61a8ff);border-radius:22px;overflow:hidden}
.block.done{opacity:.76}
.blockHead{display:flex;gap:12px;align-items:flex-start;padding:16px}
.check{width:28px;height:28px;border-radius:10px;border:2px solid rgba(191,207,241,.7);background:transparent;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#08111f;font-weight:900}
.check.on{background:var(--green);border-color:var(--green)}
.blockBody{flex:1;min-width:0}
.topline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.badge{font-family:"JetBrains Mono", monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--accent,#61a8ff);font-weight:800}
.blockTitle{font-size:29px;font-weight:800;line-height:1.12}
.blockMeta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.expand{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--txt);font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.blockDetails{padding:0 16px 16px 56px;display:grid;gap:14px}
.detailText{color:var(--muted);line-height:1.65;white-space:pre-line}
.sectionTitle{font-family:"JetBrains Mono", monospace;font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.itemGrid{display:grid;gap:8px}
.itemCard{background:rgba(255,255,255,.04);border:1px solid rgba(71,100,145,.18);border-radius:16px;padding:12px}
.itemTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.itemName{font-weight:700}
.itemMeta{font-size:13px;color:var(--muted2);margin-top:4px;line-height:1.5}
.inputRow{display:flex;gap:8px;align-items:center;margin-top:10px}
.input{width:120px;border-radius:10px;border:1px solid rgba(76,104,152,.28);background:#091323;color:var(--txt);padding:8px 10px}
.weekWrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.dayButton{width:100%;text-align:left;padding:14px;border-radius:18px;background:#0f1930;border:1px solid rgba(74,101,145,.18);color:var(--txt);margin-bottom:10px}
.dayButton.active{border-color:rgba(73,205,145,.34);background:linear-gradient(180deg,rgba(25,62,53,.76),rgba(12,28,25,.92));box-shadow:inset 0 0 0 1px rgba(73,205,145,.16)}
.dayDate{color:var(--muted);font-size:13px;margin-top:5px}
.summaryBox{background:linear-gradient(180deg,rgba(13,24,45,.96),rgba(8,16,32,.96));border:1px solid rgba(72,101,151,.18);border-radius:22px;padding:16px}
.summaryGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.summaryStat{background:rgba(255,255,255,.04);border-radius:16px;padding:12px}
.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
footer.note{margin-top:14px;color:var(--muted2);font-size:13px}
@media (max-width:900px){
  .grid4,.summaryGrid,.weather{grid-template-columns:1fr 1fr}
  .trainingHint{grid-column:1/-1}
  .weekWrap{grid-template-columns:1fr}
  .title{font-size:34px}
}
@media (max-width:640px){
  .app{padding:10px 10px 30px}
  .shell{padding:14px;border-radius:22px}
  .grid4,.weather{grid-template-columns:1fr}
  .weatherMain{align-items:flex-start}
  .temp{font-size:48px}
  .blockTitle{font-size:22px}
  .blockDetails{padding:0 14px 14px 14px}
  .headtop{flex-direction:column;align-items:flex-start}
  .pills{justify-content:flex-start}
}
</style>
</head>

const DAYS_ES = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MONTHS_ES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

const fmtDate = (d) => `${d.getDate()} ${MONTHS_ES[d.getMonth()]} ${d.getFullYear()}`;
const fmtTime = (d) => `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const keyForDate = (d) => `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const getWeekDates = (base) => {
  const baseDow = base.getDay();
  const sunday = new Date(base);
  sunday.setDate(base.getDate()-baseDow);
  return Array.from({length:7}, (_,i)=> {
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    return d;
  });
};
const roundHours = (ms) => ms ? (ms / 3600000).toFixed(1) : null;

  const [now, setNow] = useState(new Date());

  const [checked, setChecked] = useState({});

  const todayDateKey = keyForDate(now);
  const weekDates = useMemo(() => getWeekDates(now), [now.getFullYear(), now.getMonth(), now.getDate()]);

  useEffect(() => {
    const timer = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(timer);
  }, []);

  useEffect(() => {
    try {
      setChecked(JSON.parse(localStorage.getItem(`checks-${todayDateKey}`) || "{}"));
    } catch {}
  }, [todayDateKey]);

  useEffect(() => {
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  }, []);

  useEffect(() => {
    fetch("/.netlify/functions/whoop-data", { credentials:"include" })
      .then(r => r.json())
      .then(data => setWhoop({ loading:false, ...data }))

  }, []);

  useEffect(() => {
    const cacheKey = "weather-cache-v1";
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
      if (cached && Date.now() - cached.ts < 15 * 60 * 1000) {
        setWeather(cached.weather);
        setLocation(cached.location);
      }
    } catch {}

    if(!navigator.geolocation) {
      setWeatherErr("Sin geolocalización");
      return;
    }

    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude:lat, longitude:lon } = pos.coords;
      try {
        const [wRes, gRes] = await Promise.all([
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`),
          fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)
        ]);
        const wData = await wRes.json();
        const gData = await gRes.json();
        const c = wData.current;
        const nextWeather = {
          temp: Math.round(c.temperature_2m),
          feels: Math.round(c.apparent_temperature),
          humidity: c.relative_humidity_2m,
          wind: Math.round(c.wind_speed_10m),
          code: c.weather_code
        };
        const nextLocation = gData.address?.suburb || gData.address?.city_district || gData.address?.city || "Brisbane";
        setWeather(nextWeather);
        setLocation(nextLocation);
        localStorage.setItem(cacheKey, JSON.stringify({ts:Date.now(), weather:nextWeather, location:nextLocation}));
      } catch (e) {
        setWeatherErr("Error obteniendo clima");
      }
    }, () => setWeatherErr("Permiso de ubicación denegado"), { timeout:10000 });
  }, []);

  const selectedDate = weekDates[selectedDow];

  const currentProtocol = PROTOCOL[todayDow];

  const doneCount = useMemo(() => checkableBlocks.filter(b => checked[b.id]).length, [checkableBlocks, checked]);
  const progress = checkableBlocks.length ? Math.round((doneCount / checkableBlocks.length) * 100) : 0;

  const toggleCheck = (id) => {
    setChecked(prev => {
      const next = { ...prev, [id]: !prev[id] };
      localStorage.setItem(`checks-${todayDateKey}`, JSON.stringify(next));

    setWeights(prev => {
      const next = { ...prev, [key]: value };
      localStorage.setItem("weights-v2", JSON.stringify(next));
      return next;
    });
  };

  const weatherInfo = weather ? (WMO[weather.code] || { label:"Clima", icon:"🌤️" }) : null;
  const recoveryScore = whoop?.recovery?.score?.recovery_score ?? whoop?.recovery?.score?.recovery_score;
  const recoveryBucket = recoveryScore == null ? "WHOOP pendiente" : recoveryScore >= 67 ? "Verde" : recoveryScore >= 34 ? "Amarillo" : "Rojo";
  const sleepHours = roundHours(whoop?.sleep?.score?.stage_summary?.total_in_bed_time_milli || whoop?.sleep?.score?.stage_summary?.total_sleep_time_milli);
  const sleepNeed = roundHours(whoop?.sleep?.score?.sleep_needed?.baseline_milli);
  const cycleStrain = whoop?.cycle?.score?.strain != null ? Number(whoop.cycle.score.strain).toFixed(1) : "--";

  const renderBlock = (block) => {
    const style = TS[block.type] || TS.habit;
    const isChecked = !!checked[block.id];
    const isExpanded = !!expanded[block.id];
    return (
      <article key={block.id} className={`block ${isChecked ? "done" : ""}`} style={{"--accent": style.accent}}>
        <div className="blockHead">
          {block.checkable ? (
            <button className={`check ${isChecked ? "on" : ""}`} aria-label={isChecked ? `Desmarcar ${block.name}` : `Marcar ${block.name}`} onClick={() => toggleCheck(block.id)}>{isChecked ? "✓" : ""}</button>
          ) : <div style={{width:28,flex:"0 0 auto"}} />}
          <div className="blockBody">
            <div className="topline">
              <span className="badge">{style.label}</span>
              <span className="subtle">{block.time}</span>
              {block.dur && <span className="subtle">· {block.dur}</span>}
            </div>
            <div className="blockTitle">{block.icon} {block.name}</div>
            <div className="blockMeta">
              {block.exercises && <span>{block.exercises.length} ejercicios</span>}
              {block.supplements && <span>{block.supplements.length} suplementos</span>}
              {block.desc && <span>detalle disponible</span>}
            </div>
          </div>
          <button className="expand" aria-label={isExpanded ? `Ocultar detalles de ${block.name}` : `Ver detalles de ${block.name}`} onClick={() => setExpanded(p => ({ ...p, [block.id]: !p[block.id] }))}>{isExpanded ? "−" : "+"}</button>
        </div>

        {isExpanded && (
          <div className="blockDetails">
            {block.desc && <p className="detailText">{block.desc}</p>}

            {block.supplements?.length > 0 && (
              <section>
                <div className="sectionTitle">Suplementos</div>
                <div className="itemGrid" style={{marginTop:10}}>
                  {block.supplements.map((s, i) => (
                    <div className="itemCard" key={i}>
                      <div className="itemTop">
                        <div className="itemName">{s.name}</div>
                        <div className="itemName" style={{color:C.green, whiteSpace:"nowrap"}}>{s.dose}</div>
                      </div>
                      {s.note && <div className="itemMeta">{s.note}</div>}
                    </div>
                  ))}
                </div>
              </section>
            )}

            {block.exercises?.length > 0 && (
              <section>
                <div className="sectionTitle">Ejercicios</div>
                <div className="itemGrid" style={{marginTop:10}}>
                  {block.exercises.map((ex, i) => {
                    const wKey = `${todayDateKey}::${block.id}::${i}`;
                    return (
                      <div className="itemCard" key={i}>
                        <div className="itemTop">
                          <div>
                            <div className="itemName">{ex.name}</div>
                            <div className="itemMeta">{ex.sets} × {ex.reps} · descanso {ex.rest}</div>
                          </div>
                          <div className="itemName" style={{color:C.blue}}>{ex.weight || ""}</div>
                        </div>
                        {ex.note && <div className="itemMeta">{ex.note}</div>}
                        {ex.weight !== "Corporal" && (
                          <div className="inputRow">
                            <label className="subtle" htmlFor={wKey}>Peso hoy</label>
                            <input id={wKey} className="input" type="text" value={weights[wKey] || ""} placeholder="kg o lb" onChange={(e) => saveWeight(block.id, i, e.target.value)} />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </section>
            )}
          </div>
        )}
      </article>
    );
  };

  return (
    <main className="app">
      <div className="shell">
        <header className="header">
          <div className="headtop">
            <div>
              <div className="eyebrow">The 1% Protocol</div>
              <h1 className="title">{DAYS_ES[todayDow]}</h1>
              <div className="subtle">{fmtDate(now)} · {fmtTime(now)}</div>
            </div>

            <div className="pills">
              {currentProtocol && <div className="pill">{currentProtocol.tag}</div>}
              <div className="pill">{whoop.connected ? "WHOOP conectado" : "WHOOP pendiente"}</div>
            </div>
          </div>

          <div className="grid4">
            <div className="stat">
              <div className="value" style={{color:C.green}}>{progress}%</div>
              <div className="label">avance del día</div>
            </div>
            <div className="stat">
              <div className="value">{doneCount}/{checkableBlocks.length}</div>
              <div className="label">bloques completados</div>
            </div>
            <div className="stat">
              <div className="value small" style={{color: whoop.connected ? C.green : C.p }}>{whoop.loading ? "..." : recoveryBucket}</div>
              <div className="label">estado WHOOP</div>
            </div>
            <div className="stat">
              <div className="value small" style={{color:C.blue}}>{cycleStrain}</div>
              <div className="label">strain actual</div>
            </div>
          </div>

          <div className="connectRow">
            {whoop.connected ? (
              <div className="subtle">
                Recovery {recoveryScore ?? "--"} · Sleep {sleepHours ?? "--"}h · Need {sleepNeed ?? "--"}h
              </div>
            ) : (
              <>
                <a className="btn primary" href="/.netlify/functions/whoop-auth">Conectar WHOOP</a>
                <div className="subtle">Primero haz deploy, luego registra tu app en WHOOP y agrega tus variables en Netlify.</div>
              </>
            )}
          </div>

          <div className="tabs">
            <button className={`tab ${activeTab === "today" ? "active" : ""}`} onClick={() => setActiveTab("today")}>Hoy</button>
            <button className={`tab ${activeTab === "week" ? "active" : ""}`} onClick={() => setActiveTab("week")}>Semana</button>
          </div>
        </header>

        <section className="content">
          <div className="weather">
            {weather ? (
              <>
                <div className="weatherMain">
                  <div>
                    <div className="kicker">📍 {location}</div>
                    <div className="temp">{weather.temp}°</div>
                    <div className="subtle">Sensación {weather.feels}°C</div>
                  </div>
                  <div>
                    <div style={{fontSize:32}}>{weatherInfo.icon}</div>
                    <div className="itemName">{weatherInfo.label}</div>
                  </div>
                </div>
                <div className="miniCard">
                  <div className="kicker">humedad</div>
                  <div className="value small" style={{color:C.blue}}>{weather.humidity}%</div>
                </div>
                <div className="miniCard">
                  <div className="kicker">viento</div>
                  <div className="value small" style={{color:C.teal}}>{weather.wind}</div>
                  <div className="subtle">km/h</div>
                </div>
                <div className="trainingHint">
                  {weather.temp > 30 ? "Calor alto: sube electrolitos y baja intensidad si WHOOP viene amarillo o rojo." :
                    weather.humidity > 80 ? "Humedad alta: más agua y pacing conservador." :
                    whoop.connected && recoveryScore != null && recoveryScore < 34 ? "Recovery rojo: hoy toca bajar volumen, no buscar PR." :
                    "Buenas condiciones para entrenar."}
                </div>
              </>
            ) : (
              <div className="subtle">{weatherErr || "Cargando clima..."}</div>
            )}
          </div>

          {whoop.connected && (
            <div className="summaryBox">
              <div className="sectionTitle">Recovery hoy</div>
              <div className="summaryGrid" style={{marginTop:12}}>
                <div className="summaryStat"><div className="kicker">recovery</div><div className="value small" style={{color:C.green}}>{recoveryScore ?? "--"}</div></div>
                <div className="summaryStat"><div className="kicker">RHR</div><div className="value small">{whoop?.recovery?.score?.resting_heart_rate ?? "--"}</div></div>
                <div className="summaryStat"><div className="kicker">HRV</div><div className="value small">{whoop?.recovery?.score?.hrv_rmssd_milli ? Math.round(whoop.recovery.score.hrv_rmssd_milli) : "--"}</div></div>
                <div className="summaryStat"><div className="kicker">sleep</div><div className="value small">{sleepHours ?? "--"}h</div></div>
              </div>
              <div className="subtle">
                {recoveryScore == null ? "WHOOP todavía no devolvió datos útiles." :
                  recoveryScore >= 67 ? "Hoy puedes ejecutar el protocolo completo." :
                  recoveryScore >= 34 ? "Recorta volumen y evita sets al fallo." :
                  "Haz Zone 2 suave, movilidad y recuperación activa."}
              </div>
            </div>
          )}

          {activeTab === "today" ? (
            <div className="list">
              {todayBlocks.map(renderBlock)}
            </div>
          ) : (
            <div className="weekWrap">
              <aside>
                {[1,2,3,4,5,6,0].map((dow) => {
                  const d = weekDates[dow];
                  const dp = PROTOCOL[dow];
                  return (
                    <button key={dow} className={`dayButton ${selectedDow === dow ? "active" : ""}`} onClick={() => setSelectedDow(dow)}>
                      <div className="itemName">{DAYS_ES[dow]}</div>
                      <div className="dayDate">{fmtDate(d)}</div>
                      <div className="subtle" style={{marginTop:6}}>{dp?.tag || "Sin protocolo"}</div>
                    </button>
                  );
                })}
              </aside>

              <section className="summaryBox">
                <div className="headtop" style={{marginBottom:12}}>
                  <div>
                    <div className="sectionTitle">Vista semanal</div>
                    <div className="blockTitle" style={{fontSize:28}}>{DAYS_ES[selectedDow]}</div>
                    <div className="subtle">{fmtDate(selectedDate)}</div>
                  </div>
                  <div className="pill">{selectedProtocol?.tag || "Sin protocolo"}</div>
                </div>

                {selectedProtocol ? (
                  <>
                    <div className="summaryGrid">
                      <div className="summaryStat"><div className="kicker">bloques</div><div className="value small">{selectedProtocol.blocks.length}</div></div>
                      <div className="summaryStat"><div className="kicker">checkeables</div><div className="value small">{selectedProtocol.blocks.filter(b => b.checkable).length}</div></div>
                      <div className="summaryStat"><div className="kicker">ejercicios</div><div className="value small">{selectedProtocol.blocks.reduce((n,b) => n + (b.exercises?.length || 0), 0)}</div></div>
                      <div className="summaryStat"><div className="kicker">suplementos</div><div className="value small">{selectedProtocol.blocks.reduce((n,b) => n + (b.supplements?.length || 0), 0)}</div></div>
                    </div>
                    <div className="itemGrid">
                      {selectedProtocol.blocks.map((block) => {
                        const style = TS[block.type] || TS.habit;
                        return (
                          <div key={block.id} className="itemCard" style={{"--accent": style.accent, borderLeft:`4px solid ${style.accent}`}}>
                            <div className="itemTop">
                              <div>
                                <div className="itemName">{block.icon} {block.name}</div>
                                <div className="itemMeta">{block.time} · {block.dur || "—"} · {style.label}</div>
                              </div>
                            </div>
                            {block.desc && <div className="itemMeta" style={{whiteSpace:"pre-line"}}>{block.desc}</div>}
                            {block.exercises?.length > 0 && (
                              <div className="itemMeta" style={{marginTop:10}}>
                                <strong>Ejercicios:</strong> {block.exercises.map(ex => ex.name).join(" · ")}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </>
                ) : <div className="subtle">No hay protocolo cargado para este día.</div>}
              </section>
            </div>
          )}
        </section>

        <footer className="note">
          Fase fácil ejecutada: UI más limpia, header normal, semana con fecha real, weather cache 15 min, service worker, botón WHOOP y funciones serverless listas. La migración a Vite queda para la segunda fase.
        </footer>
      </div>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
